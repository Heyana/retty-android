name: Build macOS DMG

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      require-notarization:
        description: Require Developer ID signing and Apple notarization
        type: boolean
        default: false
  workflow_call:
    inputs:
      require-notarization:
        description: Refuse unsigned or unnotarized release packages
        type: boolean
        default: false
    outputs:
      notarized:
        value: ${{ jobs.build-dmg.outputs.notarized }}
    secrets:
      MYGO_UPDATER_PRIVATE_KEY:
        required: false
      MACOS_CERTIFICATE_P12:
        required: false
      MACOS_CERTIFICATE_PASSWORD:
        required: false
      MACOS_NOTARY_KEY:
        required: false
      MACOS_NOTARY_KEY_ID:
        required: false
      MACOS_NOTARY_ISSUER_ID:
        required: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-dmg-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-dmg:
    runs-on: macos-15
    timeout-minutes: 45
    outputs:
      notarized: ${{ steps.notarize.outputs.notarized || 'false' }}
    env:
      GOWORK: 'off'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Prepare optional Developer ID signing
        id: signing
        shell: bash
        env:
          CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          NOTARY_KEY: ${{ secrets.MACOS_NOTARY_KEY }}
          NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}
          REQUIRE_NOTARIZATION: ${{ inputs.require-notarization || false }}
        run: |
          set -euo pipefail
          if [[ -z "$CERTIFICATE_P12$CERTIFICATE_PASSWORD$NOTARY_KEY$NOTARY_KEY_ID$NOTARY_ISSUER_ID" ]]; then
            if [[ "$REQUIRE_NOTARIZATION" == true ]]; then
              echo '::error::Release requires Apple notarization. Configure MACOS_CERTIFICATE_P12, MACOS_CERTIFICATE_PASSWORD (if set), MACOS_NOTARY_KEY, MACOS_NOTARY_KEY_ID and MACOS_NOTARY_ISSUER_ID in Actions Secrets.'
              exit 1
            fi
            echo 'enabled=false' >> "$GITHUB_OUTPUT"
            echo 'identity=-' >> "$GITHUB_OUTPUT"
            echo '::warning::Developer ID credentials are absent; this DMG is ad hoc signed and not notarized.'
            exit 0
          fi
          for name in CERTIFICATE_P12 NOTARY_KEY NOTARY_KEY_ID NOTARY_ISSUER_ID; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Incomplete macOS signing credentials: $name is missing."
              exit 1
            fi
          done
          umask 077
          folder="$RUNNER_TEMP/retty-signing"
          mkdir -p "$folder"
          printf '%s' "$CERTIFICATE_P12" | base64 --decode > "$folder/certificate.p12"
          printf '%s' "$NOTARY_KEY" > "$folder/notary-key.p8"
          password=$(openssl rand -hex 32)
          echo "::add-mask::$password"
          keychain="$folder/signing.keychain-db"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security import "$folder/certificate.p12" -k "$keychain" -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$password" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" "$HOME/Library/Keychains/login.keychain-db"
          identity=$(security find-identity -v -p codesigning "$keychain" | sed -n 's/.*"\(Developer ID Application:.*\)".*/\1/p')
          if [[ -z "$identity" || "$identity" == *$'\n'* ]]; then
            echo '::error::The P12 must contain exactly one valid Developer ID Application identity and private key.'
            exit 1
          fi
          echo 'enabled=true' >> "$GITHUB_OUTPUT"
          echo "identity=$identity" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Test update release validation
        run: go test ./tools/verifyupdates

      - name: Build notarized apps and signed updates
        shell: bash
        env:
          SIGNING_IDENTITY: ${{ steps.signing.outputs.identity }}
          SIGNING_ENABLED: ${{ steps.signing.outputs.enabled }}
          REQUIRE_NOTARIZATION: ${{ inputs.require-notarization || false }}
          MYGO_UPDATER_PRIVATE_KEY: ${{ secrets.MYGO_UPDATER_PRIVATE_KEY }}
          NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ "$REQUIRE_NOTARIZATION" == true && -z "$MYGO_UPDATER_PRIVATE_KEY" ]]; then
            echo '::error::Release requires MYGO_UPDATER_PRIVATE_KEY for signed app updates.'
            exit 1
          fi
          cp mygo.json "$RUNNER_TEMP/retty-mygo.json"
          trap 'cp "$RUNNER_TEMP/retty-mygo.json" mygo.json' EXIT
          if [[ "$SIGNING_ENABLED" == true ]]; then
            xcrun notarytool store-credentials RettyActions \
              --key "$RUNNER_TEMP/retty-signing/notary-key.p8" \
              --key-id "$NOTARY_KEY_ID" --issuer "$NOTARY_ISSUER_ID" \
              --keychain "$RUNNER_TEMP/retty-signing/signing.keychain-db"
            python3 - <<'PYCONFIG'
          import json, os
          from pathlib import Path
          path = Path('mygo.json')
          config = json.loads(path.read_text())
          config['macos']['notarize'] = {
              'keychainProfile': 'RettyActions',
              'keychain': str(Path(os.environ['RUNNER_TEMP']) / 'retty-signing/signing.keychain-db'),
          }
          path.write_text(json.dumps(config))
          PYCONFIG
          fi
          # MyGo staples each app BEFORE signing its update archive and deltas.
          env -u MYGO_INSPECTOR go tool mygo build \
            -platform darwin/universal,darwin/arm64,darwin/amd64 -sign "$SIGNING_IDENTITY" . \
            2>&1 | tee "$RUNNER_TEMP/retty-build.log"
          if [[ -n "$MYGO_UPDATER_PRIVATE_KEY" ]]; then
            go run ./tools/verifyupdates -dir build
          fi

      - name: Verify Apple tickets and Gatekeeper
        id: notarize
        if: steps.signing.outputs.enabled == 'true'
        shell: bash
        run: |
          set -euo pipefail
          for target in darwin-universal darwin-arm64 darwin-amd64; do
            app="build/$target/Retty.app"
            xcrun stapler validate "$app"
            spctl --assess --type execute --verbose=4 "$app"
            for image in build/"$target"/*.dmg; do
              xcrun stapler validate "$image"
              spctl --assess --type open --context context:primary-signature --verbose=4 "$image"
            done
          done
          echo 'notarized=true' >> "$GITHUB_OUTPUT"
          echo 'macOS: Developer ID signed, Apple notarized and Gatekeeper verified; update archives include stapled tickets.' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload build and notarization diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: macOS-notarization
          path: ${{ runner.temp }}/retty-build.log
          if-no-files-found: ignore
          retention-days: 14

      - name: Verify architectures, release tags, signature and disk image
        shell: bash
        run: |
          set -euo pipefail
          app=build/darwin-universal/Retty.app
          binary="$app/Contents/MacOS/Retty"
          lipo "$binary" -verify_arch arm64 x86_64
          for arch in arm64 x86_64; do
            thin="$RUNNER_TEMP/Retty-$arch"
            lipo "$binary" -thin "$arch" -output "$thin"
            info=$(go version -m "$thin")
            grep -F mygo_noinspector <<< "$info"
          done
          codesign --verify --deep --strict "$app"
          images=(build/darwin-universal/*.dmg)
          [[ ${#images[@]} -eq 1 ]]
          version=$(python3 -c 'import json; print(json.load(open("mygo.json"))["version"])')
          for image in "${images[@]}"; do
            # GitHub rewrites spaces in asset names; checksum filenames must stay identical after download.
            target="build/darwin-universal/Retty-$version-macos-universal.dmg"
            mv "$image" "$target"
            image="$target"
            hdiutil verify "$image"
            (cd "$(dirname "$image")" && shasum -a 256 "$(basename "$image")") > "$image.sha256"
          done

      - name: Upload DMG
        uses: actions/upload-artifact@v7
        with:
          name: Retty-macos-universal-dmg
          path: |
            build/darwin-universal/*.dmg
            build/darwin-universal/*.dmg.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Collect signed app updates
        if: ${{ hashFiles('build/darwin-universal/update-*.json') != '' }}
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          mkdir -p build/updates
          cp build/darwin-*/*.tar.gz build/darwin-*/*.delta build/darwin-*/update-*.json build/updates/
          go run ./tools/verifyupdates -dir build/updates -flat

      - name: Upload signed app updates
        if: ${{ hashFiles('build/darwin-universal/update-*.json') != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: Retty-macos-updates
          path: build/updates/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Remove temporary signing credentials
        if: always()
        shell: bash
        run: |
          folder="$RUNNER_TEMP/retty-signing"
          if [[ -f "$folder/signing.keychain-db" ]]; then
            security delete-keychain "$folder/signing.keychain-db"
          fi
          rm -rf "$folder"
